<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 検索エンジン向け基本設定 -->
  <title>山の端 — 東京から見える山並みシミュレーター | 地形データ再現</title>
  <meta name="description" content="練馬区役所展望ロビー・東京都庁展望室・東京北部から見える富士山や奥多摩などの山並みを地形データから再現したWebツール。視点を切り替えて山の名前や配置を確認できます。">
  <meta name="keywords" content="練馬区役所,東京都庁,展望室,展望ロビー,山,稜線,地形データ">

  <meta name="google-site-verification" content="5EFQY2j4xA6YwSnMCd0jZUmXuqOqqt65Y9Ba-PZkMbk" />

  <!-- OGP (Open Graph Protocol) -->
  <meta property="og:title" content="山の端 — 東京から見える山並みシミュレーター">
  <meta property="og:description" content="練馬区役所展望ロビー・東京都庁展望室・東京北部から見える稜線を地形データより再現.視点切替,スマホ対応,タップで山名,両端タップで山移動,ピンチで倍率変更,ドラッグで方位変更.">
  <meta property="og:image" content="https://rtos-hub.github.io/GHpage/ogp.png">
  <meta property="og:url" content="https://rtos-hub.github.io/GHpage/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">

  <style>
    /* ── リセット・基礎 ─────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 各ビューア（NC/SJ/TC）のヘッダーと同じ配色 */
    :root {
      --ui-bg:      rgba(30, 60, 100, 0.88);
      --ui-text:    #e8f4ff;
      --ui-accent:  #aaccee;
      --font-main:  'Noto Serif JP', 'Georgia', serif;
    }

    html, body {
      width: 100%; height: 100%;
      background: rgb(30, 60, 100);
      color: var(--ui-text);
      font-family: var(--font-main);
      overflow: hidden;
      touch-action: manipulation;
    }

    /* ── レイアウト ─────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;    /* fallback: dvh 非対応ブラウザ用 */
      height: 100dvh;   /* モバイル: アドレスバーの出入りに追従 */
    }

    /* ── ヘッダー（視点の切り替えを含む） ────── */
    #header {
      flex-shrink: 0;
      padding: 4px 14px;
      background: var(--ui-bg);
      border-bottom: 1px solid rgba(170,204,238,0.3);
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }
    #header * { touch-action: manipulation; }

    #header h1 {
      flex-shrink: 0;
      font-size: 1.0rem;
      letter-spacing: 0.12em;
      color: var(--ui-accent);
      font-weight: 400;
    }

    /* 視点リストボックス: 見た目は各ビューアの山名リストボックスにそろえる。
       スマートフォンでは OS 標準の選択画面が開くので、ここは短い名前だけでよい */
    .view-picker {
      position: relative;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    #view-select {
      appearance: none;
      -webkit-appearance: none;
      /* 背景色は各ビューアの山名リストボックス（#mountain-select）に合わせる */
      background: rgba(10, 30, 65, 0.92);
      color: var(--ui-accent);
      font-family: inherit;
      font-size: 0.80rem;
      letter-spacing: 0.04em;
      border: 1px solid rgba(170,204,238,0.4);
      border-radius: 3px;
      padding: 2px 22px 2px 8px;
      cursor: pointer;
    }
    #view-select:hover,
    #view-select:focus-visible {
      border-color: var(--ui-accent);
      outline: none;
    }
    #view-select option {
      background: #0d1e38;
      color: #c8e0f4;
    }
    .view-picker::after {
      content: "▾";
      position: absolute;
      right: 7px;
      font-size: 0.75rem;
      color: var(--ui-accent);
      pointer-events: none;
    }

    /* 視点の詳細（座標・標高）: 各ビューアのサブタイトルをそのまま表示 */
    #header .subtitle {
      min-width: 0;
      font-size: 0.70rem;
      color: #8a9aaa;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* スマートフォン（縦向き・横向きとも）: 詳細は省いて1行に収める */
    @media (max-width: 767px),
           (orientation: landscape) and (max-height: 500px) {
      #header .subtitle { display: none; }
    }

    /* ── ビューア本体 ───────────────────────── */
    #viewer {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      display: block;
      background: rgb(30, 60, 100);
      /* 読み込み中は各ビューアのヘッダーがちらつかないよう隠す */
      visibility: hidden;
    }
    #viewer.ready { visibility: visible; }
  </style>
</head>
<body>

<div id="app">
  <div id="header">
    <h1>山の端</h1>
    <div class="view-picker">
      <select id="view-select" aria-label="視点">
        <option value="SJ">東京北部</option>
        <option value="NC">練馬区役所展望ロビー</option>
        <option value="TC">東京都庁展望室</option>
      </select>
    </div>
    <span class="subtitle" id="subtitle"></span>
  </div>

  <iframe id="viewer" title="山の端ビューア"></iframe>
</div>

<script>
// iOS Safari はピンチズームを touch-action とは別の gesture イベントで扱うため無効化する
["gesturestart", "gesturechange", "gestureend"].forEach(type => {
  document.addEventListener(type, e => e.preventDefault());
});

// ヘッダーの文字部分のダブルタップズームを抑止する（リストボックスは対象外）
let lastTextTapAt = 0;
document.addEventListener("touchend", e => {
  const t = e.target;
  if (!t.closest("#header")) return;
  if (t.closest("select, option")) return;
  const now = Date.now();
  if (now - lastTextTapAt < 350) e.preventDefault();
  lastTextTapAt = now;
}, { passive: false });

// ═══════════════════════════════════════════════
// 視点の切り替え
// ═══════════════════════════════════════════════
// 各ビューア（./SJ ./NC ./TC）は独立した完成品なので改変しない。
// このページが iframe で読み込み、ビューア側のヘッダーを隠して、
// 代わりにこのページのヘッダー（視点リストボックス付き）を表示する。
const VIEWS = ["SJ", "NC", "TC"];
const DEFAULT_VIEW = "SJ";
const STORAGE_KEY = "yamanoha-view";

const viewer    = document.getElementById("viewer");
const select    = document.getElementById("view-select");
const subtitle  = document.getElementById("subtitle");
let   loadCount = 0;

function readSavedView() {
  try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
}
function saveView(v) {
  try { localStorage.setItem(STORAGE_KEY, v); } catch (e) { /* 保存できなくても動作に支障なし */ }
}

// 表示する視点: URL の ?v= → 前回の選択 → 既定値（東京北部）
function initialView() {
  const fromUrl = new URLSearchParams(location.search).get("v");
  if (fromUrl && VIEWS.includes(fromUrl.toUpperCase())) return fromUrl.toUpperCase();
  const saved = readSavedView();
  if (saved && VIEWS.includes(saved)) return saved;
  return DEFAULT_VIEW;
}

function showView(v) {
  select.value = v;
  saveView(v);

  // URL を共有・ブックマークできるよう ?v= を反映（履歴は増やさない）
  const url = new URL(location.href);
  url.searchParams.set("v", v);
  history.replaceState(null, "", url);

  viewer.classList.remove("ready");
  const src = `./${v}/index.html`;
  // iframe.src の書き換えはブラウザの「戻る」履歴を増やすので、2回目以降は replace を使う
  if (viewer.contentWindow && viewer.getAttribute("src")) {
    viewer.contentWindow.location.replace(src);
  } else {
    viewer.setAttribute("src", src);
  }
}

// ビューアの読み込み完了: ヘッダーを隠し、レイアウトを計算し直させる
viewer.addEventListener("load", () => {
  loadCount++;
  let doc;
  try { doc = viewer.contentDocument; } catch (e) { doc = null; }

  if (doc && doc.head) {
    const style = doc.createElement("style");
    style.textContent =
      "#header { display: none !important; }" +
      // 横向きガイドは最初に開いた視点でだけ表示する
      (loadCount > 1 ? "#landscape-hint { display: none !important; }" : "");
    doc.head.appendChild(style);

    // ビューアのサブタイトル（座標・標高）とページタイトルを取り込む
    const sub = doc.querySelector("#header .subtitle");
    subtitle.textContent = sub ? sub.textContent : "";
    subtitle.title = subtitle.textContent;
    if (doc.title) document.title = doc.title;

    // ビューアはヘッダーの高さを差し引いてキャンバスの高さを決めているため、
    // ヘッダーを隠したことを resize イベントで知らせる
    viewer.contentWindow.dispatchEvent(new Event("resize"));
  }

  viewer.classList.add("ready");
});

select.addEventListener("change", () => showView(select.value));

showView(initialView());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(err => {
    console.warn('Service Worker 登録失敗:', err);
  });
}
</script>
</body>
</html>
